# aws-orgseed: per-org bootstrap roles.
#
# Least-privilege split:
#   - OrgSeedAdmin can manage the two bootstrap CFN stacks (this stack and
#     state-backend.yaml) -- i.e. it can touch IAM/CloudFormation/S3/DynamoDB
#     resources tagged orgseed:managed. It is never used for application
#     changes (SCPs, CloudTrail, Config, Identity Center).
#   - TerraformCI can read/write Terraform state and manage the Phase 1
#     guardrail baseline (Organizations, CloudTrail, Config, IAM Identity
#     Center). It is explicitly denied IAM actions on the two orgseed roles
#     themselves and CloudFormation actions on the two bootstrap stacks, so
#     that a compromised or over-broadened day-to-day CI run can never
#     rewrite its own trust policy or re-grant itself OrgSeedAdmin's
#     permissions.
#
# TerraformCiRole's guardrail-baseline statements are scoped to a specific
# resource ARN wherever AWS supports resource-level permissions for that
# action (Organizations policy/target ARNs, CloudTrail trail ARNs). A small
# remaining set of actions -- organizations:CreatePolicy,
# organizations:EnablePolicyType, and the Config recorder/delivery-channel
# Put* calls -- have no resource ARN that exists before the call succeeds,
# so AWS requires Resource: "*" for them; those statements are constrained
# instead by an aws:RequestedRegion condition and are called out with an
# inline checkov skip rather than silently passing.
AWSTemplateFormatVersion: '2010-09-09'
Description: >
  aws-orgseed: per-org bootstrap roles (OrgSeedAdmin + TerraformCI), both
  trusting only the hub seeder role. Deploy into each target org's
  management account using initial admin/break-glass access. See the
  comment block above this line for the least-privilege design.

Parameters:
  HubRoleArn:
    Type: String
    Description: ARN of the hub seeder role (output of oidc-provider.yaml)
  OrgAlias:
    Type: String
    Description: Short name for this org, used in resource naming (e.g. acme-commercial)
  SeedingAdminRoleName:
    Type: String
    Default: OrgSeedAdmin
  TerraformCiRoleName:
    Type: String
    Default: orgseed-ci
  SeedingAdminMaxSessionSeconds:
    Type: Number
    Default: 3600
    Description: Kept short — this role only runs during bootstrap/re-seed
  CiTrustRef:
    Type: String
    Description: >
      Per-org secret-like token (matches cli/orgs.yaml's ci_trust_ref for
      this org) required as the sts:ExternalId when the hub role assumes
      either role below. This is confused-deputy protection (the standard
      use of ExternalId), not branch/environment enforcement -- GitHub ref
      scoping is handled once, for the whole hub, in oidc-provider.yaml's
      AllowedRef parameter.
    NoEcho: true

Resources:
  # Bootstrap + re-seed only. Can create/update the bootstrap CFN stacks
  # (this stack and state-backend.yaml) -- nothing else. Not used for any
  # application-level (SCP/CloudTrail/Config) change.
  OrgSeedAdminRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref SeedingAdminRoleName
      MaxSessionDuration: !Ref SeedingAdminMaxSessionSeconds
      Tags:
        - Key: orgseed:managed
          Value: "true"
        - Key: orgseed:org-alias
          Value: !Ref OrgAlias
        - Key: orgseed:role-purpose
          Value: bootstrap-only
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref HubRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref CiTrustRef
      Policies:
        - PolicyName: orgseed-bootstrap-stack-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageBootstrapStacks
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:TagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/orgseed-*/*"
              - Sid: ManageOrgseedRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${SeedingAdminRoleName}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformCiRoleName}"
              - Sid: ManageStateBackend
                Effect: Allow
                Action:
                  - s3:CreateBucket
                  - s3:PutBucketPolicy
                  - s3:GetBucketPolicy
                  - s3:PutEncryptionConfiguration
                  - s3:GetEncryptionConfiguration
                  - s3:PutBucketVersioning
                  - s3:GetBucketVersioning
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketTagging
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::tfstate-*"
              - Sid: ManageLockTable
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:TagResource
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/tflock-*"
              - Sid: ReadOnlyCallerIdentity
                Effect: Allow
                Action:
                  - sts:GetCallerIdentity
                Resource: "*"

  # Day-to-day Terraform runs use this role, not OrgSeedAdmin. It reads/
  # writes Terraform state and manages the Phase 1 guardrail baseline
  # (org-baseline module: SCPs, CloudTrail, Config, IAM Identity Center).
  # It is explicitly denied any ability to touch the two orgseed IAM roles
  # or the bootstrap CloudFormation stacks -- see the Deny statement below.
  #checkov:skip=CKV_AWS_111:organizations:CreatePolicy/EnablePolicyType and the
  #  Config recorder/delivery-channel Put* calls below have no resource ARN
  #  that exists prior to the call succeeding, so AWS requires Resource: "*"
  #  for them. They're constrained by an aws:RequestedRegion condition
  #  instead (see the OrganizationsUnscopableWrites/ConfigUnscopableWrites
  #  statements). Every other write action on this role is scoped to a
  #  specific resource ARN pattern.
  TerraformCiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref TerraformCiRoleName
      Tags:
        - Key: orgseed:managed
          Value: "true"
        - Key: orgseed:org-alias
          Value: !Ref OrgAlias
        - Key: orgseed:role-purpose
          Value: terraform-ci
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref HubRoleArn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref CiTrustRef
      Policies:
        - PolicyName: orgseed-terraform-state-access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: StateObjectAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::tfstate-*"
                  - !Sub "arn:${AWS::Partition}:s3:::tfstate-*/*"
              - Sid: LockTableAccess
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/tflock-*"
        - PolicyName: orgseed-guardrail-baseline
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OrganizationsReadOnly
                Effect: Allow
                Action:
                  - organizations:Describe*
                  - organizations:List*
                Resource: "*"
              - Sid: OrganizationsPolicyLifecycle
                Effect: Allow
                Action:
                  - organizations:UpdatePolicy
                  - organizations:DeletePolicy
                Resource:
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:policy/o-*/service_control_policy/p-*"
              - Sid: OrganizationsPolicyAttachment
                Effect: Allow
                Action:
                  - organizations:AttachPolicy
                  - organizations:DetachPolicy
                Resource:
                  # Both the policy and the attachment target must match one
                  # of these patterns. Guardrails are attached at root/OU
                  # level, not per-account -- add an account/* pattern here
                  # if you ever attach directly to a member account.
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:policy/o-*/service_control_policy/p-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:root/o-*/r-*"
                  - !Sub "arn:${AWS::Partition}:organizations::${AWS::AccountId}:ou/o-*/ou-*"
              - Sid: OrganizationsUnscopableWrites
                Effect: Allow
                Action:
                  - organizations:CreatePolicy
                  - organizations:EnablePolicyType
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref "AWS::Region"
              - Sid: CloudTrailReadOnly
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                Resource: "*"
              - Sid: CloudTrailTrailManagement
                Effect: Allow
                Action:
                  - cloudtrail:CreateTrail
                  - cloudtrail:UpdateTrail
                  - cloudtrail:PutEventSelectors
                  - cloudtrail:StartLogging
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudtrail:*:${AWS::AccountId}:trail/orgseed-*"
              - Sid: ConfigReadOnly
                Effect: Allow
                Action:
                  - config:Describe*
                Resource: "*"
              - Sid: ConfigUnscopableWrites
                Effect: Allow
                Action:
                  - config:PutConfigRule
                  - config:PutConfigurationRecorder
                  - config:PutDeliveryChannel
                  - config:PutRetentionConfiguration
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref "AWS::Region"
              - Sid: IdentityCenterReadOnly
                Effect: Allow
                Action:
                  - sso:Describe*
                  - sso:List*
                  - identitystore:Describe*
                  - identitystore:List*
                Resource: "*"
        - PolicyName: orgseed-self-escalation-guard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Belt-and-suspenders: even if a future change accidentally
              # broadens the allow statements above, this Deny blocks the
              # one thing that actually matters -- TerraformCI editing its
              # own (or OrgSeedAdmin's) trust/permissions, or touching the
              # bootstrap stacks that manage them.
              - Sid: DenySelfEscalation
                Effect: Deny
                Action:
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:DeleteRole
                Resource:
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${SeedingAdminRoleName}"
                  - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${TerraformCiRoleName}"
              - Sid: DenyBootstrapStackAccess
                Effect: Deny
                Action:
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:*:${AWS::AccountId}:stack/orgseed-roles-*/*"

Outputs:
  OrgSeedAdminRoleArn:
    Value: !GetAtt OrgSeedAdminRole.Arn
  TerraformCiRoleArn:
    Value: !GetAtt TerraformCiRole.Arn
