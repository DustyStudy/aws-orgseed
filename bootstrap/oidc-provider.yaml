AWSTemplateFormatVersion: '2010-09-09'
Description: >
  aws-orgseed: GitHub Actions OIDC provider + hub seeder role.
  Deploy ONCE in the hub account. Every org's OrgSeedAdmin/TerraformCI role
  (see org-seeding-role.yaml) trusts this role's ARN, so this is the only
  account in the whole setup that holds an OIDC identity provider.

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub org/user that owns the orgseed repo (e.g. DustyStudy)
  GitHubRepo:
    Type: String
    Default: aws-orgseed
    Description: Repo name, used to scope the OIDC sub claim
  SubjectFormat:
    Type: String
    Default: immutable
    AllowedValues: [immutable, classic]
    Description: >
      Which `sub` claim format GitHub emits for this repo. `immutable`:
      repo:<owner>@<owner-id>/<repo>@<repo-id>:<suffix> - the default for repos
      created recently, and stronger (a renamed, deleted or re-created repo cannot
      impersonate this one). `classic`: repo:<owner>/<repo>:<suffix>. Check yours
      with: gh api repos/<owner>/<repo>/actions/oidc/customization/sub
      (use_immutable_subject: true means immutable). Getting this wrong does not
      error - the trust condition simply never matches and the hub role can never
      be assumed - which is why immutable requires both IDs below.
  GitHubOrgId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: >
      Numeric GitHub owner ID (required when SubjectFormat is immutable):
      gh api repos/<owner>/<repo> -q .owner.id
  GitHubRepoId:
    Type: String
    Default: ""
    AllowedPattern: "^[0-9]*$"
    Description: >
      Numeric GitHub repository ID (required when SubjectFormat is immutable):
      gh api repos/<owner>/<repo> -q .id
  AllowedRef:
    Type: String
    Default: "environment:orgseed"
    Description: >
      The GitHub OIDC subject suffix allowed to assume the hub role. The
      default trusts only jobs that run in the "orgseed" GitHub Environment
      (seed.yml does), so reaching org-management admin needs the
      Environment's required-reviewer approval - a push to main alone is not
      enough. Restrict that Environment to the main branch in repo settings.
      Use ref:refs/heads/main only if you accept that anyone who can push to
      main can seed every org. NOTE: a job that declares `environment:` presents
      sub = repo:<org>/<repo>:environment:<name> (or the immutable-ID form, see
      SubjectFormat), NOT the ref, so this value and seed.yml's environment name
      must match.
  ExistingOidcProviderArn:
    Type: String
    Default: ""
    Description: >
      An account can hold only ONE IAM OIDC provider per issuer URL. If this
      account already has one for https://token.actions.githubusercontent.com
      (another repo's bootstrap, an earlier setup), paste its ARN here and this
      stack will reuse it instead of failing with EntityAlreadyExists. The
      existing provider must list sts.amazonaws.com as an allowed audience.
      Leave empty to create the provider.
  HubRoleName:
    Type: String
    Default: orgseed-hub
  ThumbprintOverride:
    Type: CommaDelimitedList
    Default: "6938fd4d98bab03faadb97b34396831e3780aea1,1c58a3a8518e8759bf075b76b750d4f2df264fcd"
    Description: >
      GitHub Actions OIDC thumbprints. AWS validates the cert chain directly
      as of 2023, but IAM still requires a value here; leave the default
      unless GitHub rotates their intermediate CA.

Rules:
  ImmutableSubjectNeedsIds:
    RuleCondition: !Equals [!Ref SubjectFormat, immutable]
    Assertions:
      - Assert: !Not [!Equals [!Ref GitHubOrgId, ""]]
        AssertDescription: >
          SubjectFormat is immutable, so GitHubOrgId is required. Look it up with:
          gh api repos/<owner>/<repo> -q .owner.id
          (or set SubjectFormat=classic if the repo's use_immutable_subject is false)
      - Assert: !Not [!Equals [!Ref GitHubRepoId, ""]]
        AssertDescription: >
          SubjectFormat is immutable, so GitHubRepoId is required. Look it up with:
          gh api repos/<owner>/<repo> -q .id
          (or set SubjectFormat=classic if the repo's use_immutable_subject is false)

Conditions:
  UseImmutableSubject: !Equals [!Ref SubjectFormat, immutable]
  CreateProvider: !Equals [!Ref ExistingOidcProviderArn, ""]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList: !Ref ThumbprintOverride

  HubSeederRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref HubRoleName
      Description: >
        Sole OIDC-trusted role in this setup. Assumes into each org's
        OrgSeedAdmin/TerraformCI role - never granted permissions directly
        beyond sts:AssumeRole.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !GetAtt GitHubOidcProvider.Arn, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !If
                  - UseImmutableSubject
                  - !Sub "repo:${GitHubOrg}@${GitHubOrgId}/${GitHubRepo}@${GitHubRepoId}:${AllowedRef}"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:${AllowedRef}"
      Policies:
        - PolicyName: assume-into-orgs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:ResourceTag/orgseed:managed: "true"

Outputs:
  HubRoleArn:
    Description: Paste this ARN into cli/orgs.yaml as hub_role_arn
    Value: !GetAtt HubSeederRole.Arn
  OidcProviderArn:
    Description: The provider the hub role trusts (created here, or the one you supplied)
    Value: !If [CreateProvider, !GetAtt GitHubOidcProvider.Arn, !Ref ExistingOidcProviderArn]
