name: seed

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Limit to a single org alias (blank = all orgs in cli/orgs.yaml)"
        required: false
        default: ""

permissions:
  id-token: write   # required for OIDC -- do not add contents: write here
  contents: read

# One seed run at a time: two concurrent CloudFormation updates of the same
# stacks would race.
concurrency:
  group: orgseed
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    # THE approval gate. OrgSeedAdmin can rewrite its own IAM role, so whoever
    # can run this job can, in effect, administer every org's management
    # account. Configure this GitHub Environment with required reviewers and
    # restrict it to the main branch (Settings -> Environments -> orgseed).
    #
    # The name matters: a job with `environment:` presents an OIDC subject of
    # repo:<org>/<repo>:environment:orgseed, which is what oidc-provider.yaml's
    # AllowedRef trusts by default. Renaming this means updating that stack.
    environment: orgseed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure AWS credentials (assumes orgseed-hub via OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          # A SECRET, not a variable: the ARN contains the hub account ID, and a step's
          # `with:` inputs are printed in the run log - variables in the clear, secrets masked.
          role-to-assume: ${{ secrets.ORGSEED_HUB_ROLE_ARN }}
          aws-region: us-east-1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r cli/requirements.txt

      - name: Run seed.py
        env:
          # workflow_dispatch input goes through the environment, never into
          # the script text - otherwise a crafted value is shell injection.
          ORG_INPUT: ${{ inputs.org }}
          # The org config (account IDs, bucket names) lives in an `orgseed`
          # Environment SECRET, not in the committed cli/orgs.yaml and not in a
          # variable: this repo is public, and GitHub prints variables (and every
          # step's env) in the clear in run logs but masks secrets. Stored base64
          # so it is one line - a multi-line secret is masked line by line, which
          # is unreliable. Create it with:
          #   base64 -w0 my-orgs.yaml | gh secret set ORGSEED_CONFIG --env orgseed
          # It goes through the environment into a file, never into the script
          # text. Unset = fall back to the committed example config.
          ORGSEED_CONFIG: ${{ secrets.ORGSEED_CONFIG }}
          # Per-org ExternalIds. The config references these as
          # `ci_trust_ref: "env:ORGSEED_TRUST_<ALIAS>"`, so the values live in
          # Environment secrets, not in git. Map one line per org:
          ORGSEED_TRUST_SANDBOX: ${{ secrets.ORGSEED_TRUST_SANDBOX }}
        run: |
          config=cli/orgs.yaml
          if [ -n "$ORGSEED_CONFIG" ]; then
            config="$RUNNER_TEMP/orgs.yaml"
            printf '%s' "$ORGSEED_CONFIG" | base64 -d > "$config"
            # Mask the identifiers BEFORE anything can print them: seed.py logs the
            # management account ID, and a masked secret does not mask the values
            # parsed out of it.
            python3 - "$config" <<'PYMASK'
          import sys, yaml
          cfg = yaml.safe_load(open(sys.argv[1]))
          values = [cfg.get("hub_account_id")]
          for org in cfg.get("orgs", []):
              values += [org.get("management_account_id"), org.get("state_bucket")]
          for v in values:
              if v:
                  print(f"::add-mask::{v}")
          PYMASK
          fi
          args=(--config "$config")
          if [ -n "$ORG_INPUT" ]; then args+=(--org "$ORG_INPUT"); fi
          python cli/seed.py "${args[@]}"
