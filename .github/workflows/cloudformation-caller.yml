# Drop this in as .github/workflows/ci.yml in any CloudFormation repo
# (fedramp-cfn-library, aws-cloud-security-toolbox, aws-observability-dashboards, orgseed's bootstrap templates)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cloudformation-ci:
    uses: DustyStudy/github-actions-ci-templates/.github/workflows/cloudformation-ci.yml@v1
    with:
      templates-path: "."
