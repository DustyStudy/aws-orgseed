name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    name: cfn-lint (bootstrap templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install cfn-lint
      - run: cfn-lint bootstrap/*.yaml

  terraform-lint:
    name: terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.0"
      - run: terraform fmt -check -recursive modules/
      - name: terraform validate (each module)
        run: |
          for dir in modules/*/; do
            echo "== $dir =="
            (cd "$dir" && terraform init -backend=false && terraform validate)
          done
      - name: terraform test (mocked provider, no AWS needed)
        run: |
          for dir in modules/*/; do
            if [ -d "$dir/tests" ]; then
              echo "== $dir =="
              (cd "$dir" && terraform init -backend=false && terraform test)
            fi
          done
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6
      - run: |
          for dir in modules/*/; do
            (cd "$dir" && tflint)
          done

  checkov:
    name: checkov (CFN + Terraform SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: bridgecrewio/checkov-action@444c9db6fa75e2d9c19ebf1fde7322089be9009e # v12
        with:
          directory: .
          framework: cloudformation,terraform
          quiet: true
          soft_fail: false

  python-lint-and-sast:
    name: ruff + bandit (cli/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install ruff bandit
      - run: ruff check cli/
      - run: bandit -r cli/ -ll

  python-tests:
    name: pytest (cli/seed.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: pip install -r cli/requirements.txt -r cli/requirements-dev.txt
      - run: pytest tests/ -v
