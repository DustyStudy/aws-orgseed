name: terraform

# Applies the Phase 1 guardrail stack (stacks/baseline) to an organization, as the
# orgseed-ci role, through GitHub OIDC -> orgseed-hub -> orgseed-ci.
#
# Two approvals, on purpose. Both jobs run in the `orgseed` Environment (required
# reviewers), so:
#   1. you approve a PLAN run  -> read-only; it prints what would change
#   2. you approve the APPLY   -> only after you have read that plan
# and the apply job applies the reviewed plan FILE, so it does exactly what was
# reviewed and refuses if state moved in between.

on:
  workflow_dispatch:
    inputs:
      org:
        description: "Org alias from the org config"
        required: true
        type: string
      action:
        description: "plan = read-only. apply / destroy = plan, then a second approval, then apply that plan."
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

permissions:
  id-token: write # OIDC -> AWS; no static keys anywhere
  contents: read

# One at a time, and never alongside a seed run: both touch the same org.
concurrency:
  group: orgseed
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VERSION: "1.10.5"

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: orgseed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/orgseed-session
        with:
          config: ${{ secrets.ORGSEED_CONFIG }}
          org: ${{ inputs.org }}
          hub-role-arn: ${{ secrets.ORGSEED_HUB_ROLE_ARN }}
          # One line per org: an Environment secret cannot be chosen dynamically.
          external-id: ${{ secrets.ORGSEED_TRUST_SANDBOX }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: terraform -chdir=stacks/baseline init -input=false -backend-config=backend.hcl

      - name: Plan
        env:
          ACTION: ${{ inputs.action }}
        run: |
          flags=()
          if [ "$ACTION" = "destroy" ]; then flags+=(-destroy); fi
          terraform -chdir=stacks/baseline plan -input=false -out=tfplan "${flags[@]}"

      # Headline lines only (counts and resource addresses): job summaries are not
      # reliably masked, and these carry no identifiers or attribute values.
      - name: Summarize the plan
        env:
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### Plan (${ACTION})"
            echo '```'
            terraform -chdir=stacks/baseline show -no-color tfplan | grep -E '^(Plan:|No changes|  # )' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A plan embeds the OU ID and org data, and artifacts on a public repo are
      # downloadable by any signed-in GitHub user - so it is encrypted first.
      - name: Encrypt the plan for the apply job
        if: inputs.action != 'plan'
        env:
          PLAN_KEY: ${{ secrets.ORGSEED_PLAN_KEY }}
        run: |
          tar -C stacks/baseline -czf tfplan.tgz tfplan .terraform.lock.hcl
          openssl enc -aes-256-cbc -pbkdf2 -salt -in tfplan.tgz -out tfplan.enc -pass env:PLAN_KEY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: inputs.action != 'plan'
        with:
          name: tfplan
          path: tfplan.enc
          retention-days: 1
          if-no-files-found: error

  apply:
    if: inputs.action != 'plan'
    needs: plan
    runs-on: ubuntu-latest
    environment: orgseed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: ./.github/actions/orgseed-session
        with:
          config: ${{ secrets.ORGSEED_CONFIG }}
          org: ${{ inputs.org }}
          hub-role-arn: ${{ secrets.ORGSEED_HUB_ROLE_ARN }}
          external-id: ${{ secrets.ORGSEED_TRUST_SANDBOX }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: tfplan

      - name: Decrypt the reviewed plan
        env:
          PLAN_KEY: ${{ secrets.ORGSEED_PLAN_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in tfplan.enc -out tfplan.tgz -pass env:PLAN_KEY
          tar -C stacks/baseline -xzf tfplan.tgz

      - name: Init
        run: terraform -chdir=stacks/baseline init -input=false -backend-config=backend.hcl

      # The saved plan file: applies exactly what was reviewed, and refuses if the
      # state changed since. Deliberately NOT `-auto-approve`, which would re-plan.
      - name: Apply the reviewed plan
        run: terraform -chdir=stacks/baseline apply -input=false tfplan

      - name: Summarize
        run: |
          {
            echo "### Applied"
            echo 'SCP enforces:'
            terraform -chdir=stacks/baseline output -json scp_statement_sids || true
          } >> "$GITHUB_STEP_SUMMARY"
