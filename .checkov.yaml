# Checkov config for aws-orgseed.
#
# bootstrap/org-seeding-role.yaml no longer uses AdministratorAccess (see the
# least-privilege split documented in that template and in README.md), so
# there is no longer a skip for it here. The two skips below are unrelated
# and still accurate -- do not broaden them to other files.

skip-check:
  - CKV_AWS_273  # IAM role allows AssumeRole with * resource on hub -- scoped by ABAC tag condition instead
  - CKV_AWS_18   # S3 access logging on the tfstate bucket -- no target log bucket exists yet at
                 # bootstrap time (chicken-and-egg like the rest of this repo). Point this at a
                 # centralized log bucket from aws-cloud-security-toolbox in Phase 1, then remove
                 # this skip.

framework:
  - cloudformation
  - terraform

quiet: true
compact: true
