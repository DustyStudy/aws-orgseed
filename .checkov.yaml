# Checkov config for aws-orgseed.
#
# bootstrap/org-seeding-role.yaml no longer uses AdministratorAccess (see the
# least-privilege split documented in that template and in README.md), so
# there is no longer a skip for it here. The skips below are unrelated and
# still accurate -- do not broaden them to other files.

skip-check:
  - CKV_AWS_18   # S3 access logging on the tfstate bucket -- no target log bucket exists yet at
                 # bootstrap time (chicken-and-egg like the rest of this repo). Point this at a
                 # centralized log bucket from aws-cloud-security-toolbox in Phase 1, then remove
                 # this skip.
  - CKV2_AWS_10  # aws_cloudtrail.baseline DOES set cloud_watch_logs_group_arn and
                 # cloud_watch_logs_role_arn (required variables). This is a checkov *graph* check
                 # that only passes when the log group is an `aws_cloudwatch_log_group` RESOURCE
                 # defined in the same configuration (it requires a graph edge to one). Here the log
                 # group is deliberately external - provisioned by aws-cloud-security-toolbox /
                 # aws-observability-dashboards - so the edge can never exist. Supplying real variable
                 # values does NOT change the result (verified with --var-file); it is a
                 # scope limit of the check, not a missing control. Graph checks (CKV2_*) also ignore
                 # inline #checkov:skip comments, which is why this lives here.

framework:
  - cloudformation
  - terraform

quiet: true
compact: true
