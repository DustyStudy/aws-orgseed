# cli/orgs.yaml
# Declarative list of orgs to seed. Edit this file, then run:
#   python cli/seed.py --config cli/orgs.yaml
#
# See examples/multi-org-example.yaml for a fuller annotated example.

hub_account_id: "111111111111"
hub_role_arn: "arn:aws:iam::111111111111:role/orgseed-hub"
github_repo: "DustyStudy/aws-orgseed"

orgs:
  - alias: acme-commercial
    management_account_id: "222222222222"
    partition: aws
    regions:
      - us-east-1
    seeding_admin_role_name: OrgSeedAdmin
    ci_role_name: orgseed-ci
    state_bucket: tfstate-acme-commercial
    use_lock_table: false
    # lock_table: omitted -- only needed when use_lock_table is true.
    # Required. The sts:ExternalId the hub role must present when it assumes
    # into this org's OrgSeedAdmin/TerraformCI roles (passed to
    # org-seeding-role.yaml as CiTrustRef) -- standard confused-deputy
    # protection, not branch/environment enforcement (that's handled once, for
    # the whole hub, by oidc-provider.yaml's AllowedRef).
    #
    # Use `env:NAME` to read it from an environment variable so it never lands
    # in git: in CI, put it in the `orgseed` GitHub Environment's secrets and map
    # it in .github/workflows/seed.yml; for a local `--init`, export it in your
    # shell. Generate a unique random value per org (e.g. `openssl rand -hex 24`).
    # A literal value also works, but the shipped "CHANGE-ME-*" placeholder is
    # refused at run time.
    ci_trust_ref: "env:ORGSEED_TRUST_ACME_COMMERCIAL"
